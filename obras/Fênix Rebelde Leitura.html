<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fênix Rebelde Leitura</title>
    <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../leitura.css">
</head>
<body>
    <a href="../obras_mangas.html" class="btn btn-voltar">⭠ Voltar</a>
    <div class="header">
        <div class="titulo-autor">
            <h1>Fênix Rebelde</h1>
            <span style="font-size: 14px; color: rgba(195, 132, 255, 0.8);">Autor(a): Ren Kobayashi</span>
        </div>
        <select class="capitulos">
            <optgroup label="Capítulos">
                <option value="1">Capítulo 1</option>
                <option value="2">Capítulo 2</option>
                <option value="3" selected>Capítulo 3</option>
                <option value="4">Capítulo 4</option>
                <option value="5">Capítulo 5</option>
                <option value="... disabled">... (até cap 67)</option>
            </optgroup>
        </select>
    </div>
    <div class="info-progresso">
        <span>Progresso da Obra</span>
        <span>50% (Página 10/20)</span>
    </div>
    <div class="progresso-container" title="Progresso da leitura">
        <div class="progresso-barra"></div>
    </div>
    <div class="leitura-container">
        <p>Conteúdo da obra "Fênix Rebelde" sendo visualizado aqui...</p>
    </div>
    <div class="controles">
        <a href="#" class="btn">Página Anterior</a>
        <a href="#" class="btn">Próxima Página</a>
    </div>

</html>
