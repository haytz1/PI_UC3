<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro – AnimeSpot</title>
  <meta name="description" content="Crie sua conta no AnimeSpot e explore histórias de animes e mangás." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #0a0010;
      --bg-secondary: #110020;
      --bg-card: #1a0035;
      --purple-dark: #3b0070;
      --purple-mid: #7b2ff7;
      --purple-light: #a855f7;
      --purple-glow: #c084fc;
      --purple-bright: #d946ef;
      --text-main: #f0e6ff;
      --text-muted: #a78bca;
      --border: rgba(123, 47, 247, 0.35);
      --input-bg: rgba(30, 0, 60, 0.6);
    }

    html, body {
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
    }

    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(123,47,247,.25) 0%, transparent 70%),
        radial-gradient(ellipse 50% 40% at 80% 80%, rgba(168,85,247,.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 90%, rgba(217,70,239,.10) 0%, transparent 60%),
        var(--bg-primary);
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }
    body::before { width: 400px; height: 400px; background: rgba(123,47,247,.18); top: -100px; left: -100px; }
    body::after  { width: 350px; height: 350px; background: rgba(217,70,239,.12); bottom: -80px; right: -80px; animation-delay: -4s; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1);} 50%{transform:translateY(30px) scale(1.05);} }

    .stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .star  { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--dur,3s) ease-in-out infinite; animation-delay: var(--del,0s); opacity: 0; }
    @keyframes twinkle { 0%,100%{opacity:0;transform:scale(.8);} 50%{opacity:var(--op,.6);transform:scale(1.2);} }

    /* NAVBAR */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 64px;
      background: rgba(10, 0, 16, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 24px rgba(0,0,0,.5);
    }
    .nav-left { display: flex; align-items: center; gap: 0.6rem; }
    .nav-logo-img {
      height: 38px; width: 38px; object-fit: contain; border-radius: 10px;
      filter: drop-shadow(0 0 8px rgba(168,85,247,.7));
    }
    .nav-logo-text {
      font-size: 1.25rem; font-weight: 800;
      background: linear-gradient(135deg, #e879f9, #a855f7 50%, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 0.5px; text-decoration: none;
    }
    .nav-right { display: flex; align-items: center; gap: 0.5rem; font-size: 0.9rem; color: var(--text-muted); }
    .nav-login-link {
      font-weight: 700; color: var(--purple-light); text-decoration: none;
      padding: 0.45rem 1.1rem; border: 1.5px solid var(--border); border-radius: 10px;
      transition: background .2s, border-color .2s, color .2s, box-shadow .2s;
    }
    .nav-login-link:hover {
      background: rgba(123,47,247,.18); border-color: var(--purple-mid);
      color: var(--purple-glow); box-shadow: 0 0 12px rgba(123,47,247,.3);
    }

    /* PAGE */
    .page-wrapper {
      position: relative; z-index: 1; min-height: 100vh;
      padding-top: 100px;
      display: flex; align-items: center; justify-content: center;
      padding-bottom: 2rem; padding-left: 1rem; padding-right: 1rem;
    }

    /* CARD */
    .cadastro-card {
      width: 100%; max-width: 500px;
      background: rgba(17, 0, 32, .78);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border); border-radius: 24px; padding: 2.8rem 2.5rem 2.5rem;
      box-shadow: 0 0 0 1px rgba(123,47,247,.15), 0 8px 32px rgba(0,0,0,.6), 0 0 80px rgba(123,47,247,.12), inset 0 1px 0 rgba(255,255,255,.05);
      animation: slideUp .6s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px);} to{opacity:1;transform:translateY(0);} }

    /* Avatar */
    .avatar-wrapper { display: flex; justify-content: center; margin-bottom: 1.4rem; }
    .avatar-circle {
      position: relative; width: 90px; height: 90px; border-radius: 50%;
      background: rgba(123,47,247,.15); border: 2.5px solid var(--border); overflow: hidden;
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(123,47,247,.18), 0 0 24px rgba(168,85,247,.35);
      transition: box-shadow .3s, border-color .3s;
    }
    .avatar-circle:hover { border-color: var(--purple-mid); box-shadow: 0 0 0 4px rgba(123,47,247,.35), 0 0 32px rgba(168,85,247,.55); }
    .avatar-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: none; }
    .avatar-placeholder {
      width: 100%; height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      color: var(--text-muted); font-size: 0.7rem; font-weight: 500; text-align: center;
    }
    .avatar-placeholder svg { width: 30px; height: 30px; color: var(--purple-light); }
    .avatar-overlay {
      position: absolute; inset: 0; background: rgba(123,47,247,.45); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .25s;
    }
    .avatar-circle:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay svg { width: 22px; height: 22px; color: #fff; }
    .avatar-input { display: none; }

    /* Logo */
    .logo-wrapper { display: flex; justify-content: center; margin-bottom: 1rem; }
    .logo-img {
      width: 80px; height: 80px; object-fit: contain; border-radius: 16px;
      filter: drop-shadow(0 0 20px rgba(168,85,247,.6));
    }

    /* Titles */
    .welcome-title {
      text-align: center; font-size: 1.6rem; font-weight: 800;
      background: linear-gradient(135deg, #e879f9, #a855f7 50%, #7c3aed);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      line-height: 1.2; margin-bottom: 2rem;
    }

    /* Form */
    .form-group { margin-bottom: 1.25rem; }
    .form-label {
      display: block; font-size: .85rem; font-weight: 600; color: var(--purple-glow);
      margin-bottom: .45rem; letter-spacing: .4px; text-transform: uppercase;
    }
    .input-wrapper { position: relative; }
    .form-input {
      width: 100%; padding: .75rem 1rem;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: .97rem;
      transition: border-color .25s, box-shadow .25s, background .25s; outline: none;
    }
    .form-input::placeholder { color: rgba(167,139,202,.5); }
    .form-input:focus {
      border-color: var(--purple-mid); background: rgba(40,0,80,.7);
      box-shadow: 0 0 0 3px rgba(123,47,247,.25), 0 0 20px rgba(123,47,247,.1);
    }
    .form-input:hover:not(:focus) { border-color: rgba(123,47,247,.55); }

    /* Selects */
    .select-group { display: flex; gap: 0.5rem; }
    .form-select {
      flex: 1; padding: .75rem 1rem;
      background: var(--input-bg); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-main); font-family: 'Outfit', sans-serif; font-size: .97rem;
      transition: border-color .25s, box-shadow .25s, background .25s; outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a855f7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 1rem center; background-size: 16px;
    }
    .form-select:focus { border-color: var(--purple-mid); background-color: rgba(40,0,80,.7); }
    .form-select option { background: var(--bg-card); color: var(--text-main); }

    /* Checkbox */
    .checkbox-wrapper { display: flex; align-items: flex-start; gap: 0.5rem; margin-top: 1.5rem; margin-bottom: 1.5rem; }
    .checkbox-input {
      appearance: none; width: 18px; height: 18px; border: 2px solid var(--purple-mid);
      border-radius: 4px; background: rgba(30,0,60,.6); cursor: pointer; position: relative;
      flex-shrink: 0; margin-top: 2px;
    }
    .checkbox-input:checked { background: var(--purple-mid); }
    .checkbox-input:checked::after {
      content: ''; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px;
      border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .checkbox-label { font-size: 0.85rem; color: var(--text-muted); cursor: pointer; line-height: 1.4; }

    .divider { display: flex; align-items: center; gap: .75rem; margin: 1.5rem 0; color: var(--text-muted); font-size: .85rem; font-weight: 600; text-transform: uppercase; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Buttons */
    .btn {
      width: 100%; padding: .85rem; border-radius: 12px;
      font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700;
      cursor: pointer; border: none; transition: transform .18s, box-shadow .18s; letter-spacing: .3px;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg, #7b2ff7, #a855f7 60%, #d946ef); color: #fff; box-shadow: 0 4px 24px rgba(123,47,247,.45); }
    .btn-primary:hover { box-shadow: 0 6px 36px rgba(168,85,247,.65); transform: translateY(-2px); }
    .btn-secondary { background: transparent; color: var(--text-main); border: 2px solid var(--border); margin-bottom: 0.75rem; }
    .btn-secondary:hover { border-color: var(--purple-mid); background: rgba(123,47,247,.12); transform: translateY(-2px); }
    .btn-social-icon { width: 20px; height: 20px; object-fit: contain; }

    .login-link-container { text-align: center; margin-top: 1.5rem; }
    .login-link { color: var(--purple-light); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color .2s; }
    .login-link:hover { color: var(--purple-bright); text-decoration: underline; }

    @media(max-width:500px){
      .cadastro-card{ padding: 2rem 1.4rem 2rem; border-radius: 18px; }
      .welcome-title{ font-size: 1.4rem; }
      .navbar{ padding: 0 1rem; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars" aria-hidden="true"></div>

  <!-- NAVBAR -->
  <nav class="navbar" role="navigation" aria-label="Navegação principal">
    <div class="nav-left">
      <img src="imagens/logo_animespot.png" alt="Logo AnimeSpot" class="nav-logo-img" id="nav-logo" />
      <a href="index.html" class="nav-logo-text">AnimeSpot</a>
    </div>
    <div class="nav-right">
      <span>Já tem uma conta?</span>
      <a href="login.html" class="nav-login-link">Fazer login</a>
    </div>
  </nav>

  <!-- PÁGINA -->
  <main class="page-wrapper">
    <div class="cadastro-card" role="main">

      <!-- Foto de perfil em círculo -->
      <div class="avatar-wrapper">
        <div class="avatar-circle" id="avatar-circle" title="Clique para adicionar uma foto de perfil">
          <img src="" alt="Foto de perfil" class="avatar-img" id="avatar-img" />
          <div class="avatar-placeholder" id="avatar-placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
            <span>Foto</span>
          </div>
          <div class="avatar-overlay" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
        </div>
        <input type="file" id="avatar-input" class="avatar-input" accept="image/*" aria-label="Selecionar foto de perfil" />
      </div>

      <h1 class="welcome-title">É rápido é grátis!</h1>

      <form id="cadastro-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="input-email">E-mail</label>
          <div class="input-wrapper">
            <input type="email" id="input-email" name="email" class="form-input" placeholder="seu@email.com" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-senha">Senha</label>
          <div class="input-wrapper">
            <input type="password" id="input-senha" name="senha" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-confirmar-senha">Confirmar senha</label>
          <div class="input-wrapper">
            <input type="password" id="input-confirmar-senha" name="confirmar_senha" class="form-input" placeholder="••••••••" required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Data de nascimento (opcional)</label>
          <div class="select-group">
            <select class="form-select" id="select-dia" aria-label="Dia">
              <option value="" disabled selected>Dia</option>
              <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option>
              <option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option>
              <option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option>
            </select>
            <select class="form-select" id="select-mes" aria-label="Mês">
              <option value="" disabled selected>Mês</option>
              <option value="01">Jan</option><option value="02">Fev</option><option value="03">Mar</option><option value="04">Abr</option>
              <option value="05">Mai</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Ago</option>
              <option value="09">Set</option><option value="10">Out</option><option value="11">Nov</option><option value="12">Dez</option>
            </select>
            <select class="form-select" id="select-ano" aria-label="Ano">
              <option value="" disabled selected>Ano</option>
              <option value="2010">2010</option><option value="2009">2009</option><option value="2008">2008</option><option value="2007">2007</option>
              <option value="2006">2006</option><option value="2005">2005</option><option value="2004">2004</option><option value="2003">2003</option>
              <option value="2002">2002</option><option value="2001">2001</option><option value="2000">2000</option><option value="1999">1999</option>
              <option value="1998">1998</option><option value="1997">1997</option><option value="1996">1996</option><option value="1995">1995</option>
            </select>
          </div>
        </div>

        <div class="checkbox-wrapper">
          <input type="checkbox" id="check-newsletter" class="checkbox-input" />
          <label for="check-newsletter" class="checkbox-label">Quero receber novidades, dicas e ofertas do anime spot</label>
        </div>

        <button type="submit" class="btn btn-primary">Criar conta</button>

        <div class="divider" aria-hidden="true">Ou</div>

        <button type="button" class="btn btn-secondary">
          <svg class="btn-social-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Continuar com o Google
        </button>

        <button type="button" class="btn btn-secondary">
          <svg class="btn-social-icon" viewBox="0 0 384 512" fill="currentColor" style="color: #ffffff;">
            <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
          </svg>
          Continuar com a Apple
        </button>

        <div class="login-link-container">
          <a href="login.html" class="login-link">Já tem uma conta? Fazer login</a>
        </div>

      </form>
    </div>
  </main>

  <script>
    (function(){
      const c = document.getElementById('stars');
      for(let i = 0; i < 80; i++){
        const s = document.createElement('div'); s.className = 'star';
        const sz = (Math.random() * 2.5 + .5).toFixed(1);
        s.style.cssText = `width:${sz}px;height:${sz}px;top:${(Math.random()*100).toFixed(1)}%;left:${(Math.random()*100).toFixed(1)}%;--dur:${(Math.random()*4+2).toFixed(1)}s;--del:${(Math.random()*6).toFixed(1)}s;--op:${(Math.random()*.5+.2).toFixed(2)};`;
        c.appendChild(s);
      }
    })();

    document.getElementById('cadastro-form').addEventListener('submit', function(e){
      e.preventDefault();
      alert('Cadastro realizado com sucesso! Bem-vindo(a) ao AnimeSpot.');
    });

    const avatarCircle = document.getElementById('avatar-circle');
    const avatarInput  = document.getElementById('avatar-input');
    const avatarImg    = document.getElementById('avatar-img');
    const avatarPh     = document.getElementById('avatar-placeholder');

    avatarCircle.addEventListener('click', function(){ avatarInput.click(); });
    avatarInput.addEventListener('change', function(){
      const file = avatarInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(ev){
        avatarImg.src = ev.target.result;
        avatarImg.style.display = 'block';
        avatarPh.style.display  = 'none';
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
